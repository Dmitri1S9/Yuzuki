# Текущий курс: только Neo4j. Старый стек (Postgres archangel, Redis, analyse_service, R) — legacy/docker-compose.yaml.
# Пароль — из .env (NEO4J_PASSWORD), без дефолта в репозитории.
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data_yuzuki:/data

volumes:
  neo4j_data_yuzuki:
