# Эталонная разметка отношений Kyoka Jiro (вручную, учитель — Claude, 2026-11).
# Источник текста: research/samples/pages/Kyoka_Jiro.txt (формат "=== PAGE ===" / "== section ==" / абзац на строку).
#
# Правила разметки (см. research/REPORT.md, раздел "Эталон"):
#   links    — X, с которым в ЭТОМ абзаце у Jiro прямо заявлено действие/отношение/позиция
#              (она делает что-то X, X делает что-то ей, или текст называет их отношение).
#              affinity — список допустимых значений (positive / neutral / negative).
#   optional — упомянут рядом, но связь только косвенная (co-presence, "the two along with...",
#              местоимение без однозначного антецедента). Предсказание не штрафуется и не требуется.
#   Всё остальное, что модель назовёт в этом абзаце, — false positive.
#   "Classmate" как тип НЕ размечается: это следствие членства в Class 1-A (факт группы, не ребро).
#
# targets — эталон уровня страницы: тип связи (одно слово из research/exp/taxonomy.py) и итоговый affinity.
#   types   — что должно быть найдено (recall); also_ok — что не считается ошибкой (precision).
#   Направленные типы читаются от Jiro: mentor = "Jiro — наставник X", student = "Jiro — ученица X".

