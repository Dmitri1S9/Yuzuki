# Эталон черт характера из разделов Personality (вручную, учитель — Claude, 2026-11).
#
# Ось — полюса Big Five + Honesty-Humility из HEXACO (research/exp/taxonomy.py: TRAIT_POLES):
#   E+/E- extraversion, A+/A- agreeableness, C+/C- conscientiousness,
#   N+/N- neuroticism (N- = emotional stability), O+/O- openness, H+/H- honesty-humility.
# span     — дословный фрагмент текста (короткий, 1–4 слова), по которому черта видна.
# pole     — основной полюс; also_ok — полюса, которые тоже не считаются ошибкой.
# not_traits — то, что модель НЕ должна выдавать как черту персонажа (видимость, отрицание,
#              чужая черта, интерес/хобби). Проверка "буквальности".
# Абзацы адресуются так же, как в relations: "page|section|idx".

characters:
  Kyoka Jiro:
    paragraphs: ["Kyoka Jiro|Personality|0", "Kyoka Jiro|Personality|1",
                 "Kyoka Jiro|Personality|2", "Kyoka Jiro|Personality|3"]
    traits:
      - {span: pragmatic,              pole: C+, also_ok: [O-]}
      - {span: unenthusiastic,         pole: E-, also_ok: []}
      - {span: blunt,                  pole: A-, also_ok: [H+]}
      - {span: teasing,                pole: A-, also_ok: [E+]}
      - {span: snarky,                 pole: A-, also_ok: []}
      - {span: nice and friendly,      pole: A+, also_ok: [E+]}
      - {span: enjoy socializing,      pole: E+, also_ok: []}
      - {span: aggressive,             pole: A-, also_ok: []}
      - {span: smarter approaches,     pole: C+, also_ok: [O+]}
      - {span: organized,              pole: C+, also_ok: []}
      - {span: sensitive side,         pole: N+, also_ok: [A+]}
      - {span: defensive towards her friends, pole: A+, also_ok: []}
      - {span: empathetic,             pole: A+, also_ok: []}
      - {span: getting flustered,      pole: N+, also_ok: [H+]}
      - {span: hard to unnerve,        pole: N-, also_ok: []}
      - {span: afraid of horror,       pole: N+, also_ok: []}
      - {span: self-conscious,         pole: N+, also_ok: []}
      - {span: embarrassed about her interests, pole: N+, also_ok: []}
    not_traits:
      - "cold"          # "comes off as cold and indifferent" — видимость, текст тут же опровергает
      - "indifferent"
      - "rock music"    # интерес, не черта
      - "cluelessness"  # черта Denki, не Jiro

